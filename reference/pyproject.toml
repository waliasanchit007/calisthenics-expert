[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observation-contracts"
version = "0.1.0"
description = "Reference validator for the Phase 0 observation contracts"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.25,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
