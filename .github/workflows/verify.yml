name: Verify observation contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/pyproject.toml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: make bootstrap
      - run: make verify
      - run: make verify-harness-jvm
