name: Verify observation contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/pyproject.toml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: make bootstrap
      # `make verify` runs the --offline model-asset build-gate tests. On a clean runner the Gradle
      # cache is empty, so --offline cannot even resolve the Android Gradle Plugin and those tests
      # fail at plugin resolution instead of exercising the gate. This step resolves the plugins,
      # dependencies, and AGP tooling they need, using only the non-delivery jvmVerification
      # variant, so the delivery gate itself stays untouched. Ordering pinned by
      # reference/tests/test_ci_gradle_cache_ordering.py.
      - run: make prepare-harness-gradle-dependencies
      - run: make verify
      # Android app unit tests compile the debug resource graph, whose unconditional delivery
      # model gate must remain intact. Fetch only after the hermetic missing-asset tests above,
      # and verify the pinned SHA-256 before the protected Android test gate runs.
      - run: make fetch-model-asset
      - run: make verify-harness-jvm
      - run: make verify-kotlin-export
